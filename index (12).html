<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atlas Pokédex</title><meta name="theme-color" content="#0e7c86"><meta name="description" content="Atlas Pokédex: Pokédex completa en español con calculadoras, comparador, constructor de equipos VGC, presets de Champions y mucho más. Funciona en móvil y PC."><meta property="og:type" content="website"><meta property="og:title" content="Atlas Pokédex"><meta property="og:description" content="Pokédex en español con herramientas, equipos VGC y calculadoras."><meta property="og:image" content="icon.svg"><meta property="og:locale" content="es_ES"><meta name="twitter:card" content="summary"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: left rail on desktop, scrollable bottom tab bar on phones. Slate surfaces, one teal accent; type colours only on chips and portraits. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e9edf1; --fg:#14202b; --muted:#5b6b7a; --line:#d5dce3; --accent:#0e7c86; --accent-fg:#ffffff; --warn:#b4531a; --good:#1c7a45;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--surface:#17212b;--surface2:#1f2b37;--fg:#e8eef3;--muted:#92a3b3;--line:#2a3846;--accent:#4cc3cd;--accent-fg:#06222a;--warn:#f0a066;--good:#6fd39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--surface:#17212b;--surface2:#1f2b37;--fg:#e8eef3;--muted:#92a3b3;--line:#2a3846;--accent:#4cc3cd;--accent-fg:#06222a;--warn:#f0a066;--good:#6fd39a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}
.col{min-width:0}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:10px 0;padding-top:max(10px,env(safe-area-inset-top,0px));background:var(--bg)}
.burger{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;padding:0}
.burger:hover{border-color:var(--accent)}
.burger svg,.ngh svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#crumb{font:600 16px var(--font-display);color:var(--muted)}
.drawer{position:sticky;top:12px;align-self:start;max-height:calc(100dvh - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.brand{font:700 20px var(--font-display);padding:6px 12px 14px}
.brand small{display:block;font:400 12px var(--font-body);color:var(--muted)}
.tab{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;width:100%}
.tab:hover{color:var(--fg);background:var(--surface2)}
.tab[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.tab .n{float:right;font-size:12px;background:var(--surface2);border-radius:99px;padding:0 8px}
.ngh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:10px 12px 6px;border-radius:8px;font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ngh:hover{color:var(--fg)}
.ngh svg{width:16px;height:16px;transition:transform .15s}
.ngh[aria-expanded="true"] svg{transform:rotate(180deg)}
.ngi{display:flex;flex-direction:column;gap:2px;margin:0 0 6px 12px;padding-left:6px;border-left:2px solid var(--line)}
.scrim{display:none}
.app.collapsed{grid-template-columns:minmax(0,1fr)}
.app.collapsed .drawer{display:none}
main{min-width:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input[type=search],input[type=text],input[type=number],select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.card:hover{border-color:var(--accent)}
.card.got::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--good);font-weight:700}
.port{aspect-ratio:1/1;border-radius:8px;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.port img{width:100%;height:100%;object-fit:contain;position:relative}
.port i{position:absolute;top:6px;left:8px;font:500 11px var(--font-body);font-style:normal;color:var(--muted)}
.cname{font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px 1px 7px;background:var(--surface)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
button.chip:hover{border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.muted{color:var(--muted)}
.stat{display:grid;grid-template-columns:44px 36px 1fr;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.pri,.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px}
.mx{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mx span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.mx .x4{background:var(--warn);color:#fff}.mx .x2{outline:1px solid var(--warn)}.mx .h{outline:1px solid var(--good)}.mx .z{background:var(--fg);color:var(--bg)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;text-align:left;display:flex;gap:8px;align-items:center}
.tbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tbtn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.p{color:var(--good)}td.m{color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:0;width:min(820px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(5,10,15,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.db{padding:18px;display:flex;flex-direction:column;gap:16px}
.x{background:none;border:0;font-size:24px;line-height:1;padding:4px 8px}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.prog .track{margin-top:6px}
.stage{aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;overflow:hidden;max-width:100%}
.stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
.stage img.px{image-rendering:pixelated;width:70%}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.views button{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags button,.tags span{font-size:12px;background:var(--surface2);border:0;border-radius:6px;padding:1px 7px}
.tags button:hover{outline:1px solid var(--accent)}
.evn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.evk{display:flex;flex-direction:column;gap:8px}
.evr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evc{font-size:12px;color:var(--muted);max-width:140px}
.evb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;width:92px;font-size:12px}
.evb img{width:60px;height:60px;object-fit:contain}
.lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f2 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f2 input,.f2 select{width:100%}
.big{font:700 26px var(--font-display);font-variant-numeric:tabular-nums}
.cmpr{display:grid;grid-template-columns:44px 36px 1fr 36px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.cmpr .track{direction:rtl}
details summary{cursor:pointer;font-weight:500}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .drawer{position:fixed;left:0;top:0;bottom:0;align-self:stretch;max-height:none;width:min(300px,86vw);background:var(--surface);z-index:40;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;padding:max(16px,env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:4px 0 24px rgba(0,0,0,.25)}
  .app.open .drawer{transform:none;visibility:visible}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:35}
  .app.collapsed .drawer{display:flex}
  .detail{grid-template-columns:minmax(0,1fr)}
  .stage{max-width:320px;margin:0 auto}
}

[hidden]{display:none!important}
.fill.lo{background:var(--warn)}.fill.hi{background:var(--good)}
.hero{border-radius:14px;padding:12px;background:var(--surface2);background:linear-gradient(135deg,color-mix(in srgb,var(--h1) 40%,var(--surface)),color-mix(in srgb,var(--h2) 40%,var(--surface)));display:flex;flex-direction:column;gap:10px}
.hnav{display:flex;justify-content:space-between;gap:8px}
.hn{background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;max-width:49%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn:hover{border-color:var(--accent)}
.hbody{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:16px;align-items:center}
.hstage{aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.hstage img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.hstage img.px{image-rendering:pixelated;width:75%;filter:none}
.hnum{font:600 14px var(--font-display);color:var(--muted)}
.hname{font-size:30px;line-height:1.1}
.hgenus{color:var(--muted);font-size:14px}

.vth{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.vth button{flex:none;width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:2px}
.vth button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.srtb{display:flex;align-items:center;gap:8px;padding:6px 12px;text-align:left}
.srti{width:20px;height:20px;flex:none;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.srtl{display:flex;flex-direction:column;line-height:1.15;min-width:0}.srtl small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.srtl b{font-size:14px;font-weight:600;white-space:nowrap}
.srtd{margin-left:2px;padding:3px 8px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;white-space:nowrap}
.srtp{flex:1 1 100%;order:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.srtp[hidden]{display:none}
.srth{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.srtc{display:flex;flex-wrap:wrap;gap:7px}
.srtc button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500}
.srtc button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.srtdir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.srtdir button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 12px;text-align:left;min-width:0}
.srtdir svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.srtdir span{display:flex;flex-direction:column;min-width:0;line-height:1.2}.srtdir b{font-size:14px}.srtdir small{font-size:11.5px;color:var(--muted)}
.srtdir button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.srtdir button[aria-pressed="true"] svg{stroke:var(--accent)}
.lr{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:5px 0}
.lrp{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;min-width:0;color:inherit}
.lrp img{width:56px;height:56px;image-rendering:pixelated;object-fit:contain;flex:none}
.lrn{display:flex;flex-direction:column;line-height:1.2;min-width:0}.lrn small{font-size:11px;color:var(--muted)}.lrn b{font-size:15px}
.lrm{display:flex;flex-wrap:wrap;gap:5px;margin-left:64px}
.mc{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.mc.no{font-weight:400;color:var(--muted)}
.mc.m-level-up{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent)}

.abd{font-size:16px;line-height:1.5;margin:6px 0 10px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.abr{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;color:inherit;border-left:4px solid var(--accent)}
.abr:hover{border-color:var(--accent)}
.abt{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.abt b{font-size:16px}
.abm{display:flex;gap:5px}.abm i{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}

.wkabw{margin:4px 0 12px}.wkabw .srtc{margin-top:6px}
/* ---- VGC ---- */
.tmbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tmbar input{flex:1 1 160px}.tmbar select{flex:1 1 180px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}

.tc{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--h1) 16%,var(--surface)),var(--surface) 55%);text-align:left;min-width:0;overflow:hidden}

.tcm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tcm span{background:color-mix(in srgb,var(--surface2) 70%,transparent);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tcm small{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tcm em{font-style:normal;color:var(--muted);font-weight:400}.tcm .up{color:var(--good);font-style:normal;font-size:12px}.tcm .dn{color:var(--warn);font-style:normal;font-size:12px}

.tcst span{display:block;width:80%;height:4px;border-radius:9px;background:var(--line);overflow:hidden}.tcst span i{display:block;height:100%;background:var(--accent)}

function calcUpdate(){const g=id=>$("#"+id).value;calc.a=g("c_a");calc.d=g("c_d");calc.lv=Math.max(1,Math.min(100,+g("c_lv")||50));calc.pw=+g("c_pw")||0;calc.mt=+g("c_mt");calc.cls=g("c_cls");calc.ea=+g("c_ea");calc.ed=+g("c_ed");calc.nat=+g("c_nat");calc.crit=g("c_crit")==="1";calc.mv=g("c_mv");
  const A=lookup(calc.a),D=lookup(calc.d),e=$("#cr");if(!A||!D){e.innerHTML='<div class="empty">Elige atacante y defensor.</div>';return}
  const L=calc.lv,st=(b,ev,n)=>Math.floor((Math.floor((2*b+31+Math.floor(ev/4))*L/100)+5)*(n||1)),hp=(b,ev)=>Math.floor((2*b+31+Math.floor(ev/4))*L/100)+L+10;
  const sp=calc.cls==="s",at=st(A.s[sp?3:1],calc.ea,calc.nat),df=st(D.s[sp?4:2],calc.ed,1),H=hp(D.s[0],calc.ed);
  const stab=A.t.includes(calc.mt)?1.5:1,ef=defMult(D.t)[calc.mt];
  const base=Math.floor(Math.floor(Math.floor(2*L/5+2)*calc.pw*at/df)/50)+2;
  const dmg=r=>{let d=base;if(calc.crit)d=Math.floor(d*1.5);d=Math.floor(d*r/100);d=Math.floor(d*stab);return Math.floor(d*ef)};
  const lo=dmg(85),hi=dmg(100);const pc=x=>(x/H*100).toFixed(1);
  const hits=hi>0?Math.ceil(H/hi)+(lo>0&&Math.ceil(H/lo)!==Math.ceil(H/hi)?" a "+Math.ceil(H/lo):""):"—";
  e.innerHTML='<div class="panel"><div class="row" style="gap:28px"><div><div class="lbl">Daño</div><div class="big">'+lo+" – "+hi+'</div></div><div><div class="lbl">% de los PS del defensor ('+H+')</div><div class="big">'+pc(lo)+" – "+pc(hi)+' %</div></div><div><div class="lbl">Golpes para debilitarlo</div><div class="big">'+hits+'</div></div></div><p class="muted" style="margin:12px 0 0">Ataque '+at+" · Defensa "+df+" · STAB ×"+stab+" · Efectividad ×"+ef+(ef===0?" (inmune)":"")+"</p></div>"}

  Promise.all(Array.from({length:6},async()=>{while(i<miss.length){const k=miss[i++];try{const d=await api("item/"+k),es=lastL(d.names,"es"),fe=lastL(d.flavor_text_entries,"es"),fen=lastL(d.flavor_text_entries,"en");ITD[k]=[es?es.name:pretty(k),fe?clean(fe.text):fen?clean(fen.text):"",fe?1:0,d.cost||0]}catch(e){}}})).then(()=>{itSave();cb&&cb()})}
const pdata=id=>api("pokemon/"+id);

const itemOpts=cur=>'<option value="">Sin objeto</option>'+sortedItems().map(k=>'<option value="'+k+'"'+(k===cur?" selected":"")+">"+esc(itName(k))+"</option>").join("")+(cur&&!ITEMS.includes(cur)?'<option value="'+esc(cur)+'" selected>'+esc(pretty(cur))+"</option>":"");

const teraOpts=cur=>'<option value="-1">Sin Teracristal</option>'+TYPES.map((t,i)=>'<option value="'+i+'"'+(i===cur?" selected":"")+">"+t[0]+"</option>").join("");
const hasMove=(s,list)=>s.mv.some(m=>m&&list.includes(m));
/* ---------- exportar / importar (formato Pokémon Showdown) ---------- */
function exportSet(s){const p=DEX[s.id-1];if(!p)return"";const n=titleEn(p.name);let o=n+(s.item?" @ "+pretty(s.item):"")+"\n";
  if(s.ab)o+="Ability: "+pretty(s.ab)+"\n";if(s.lv!==100)o+="Level: "+s.lv+"\n";if(s.tera>=0)o+="Tera Type: "+TYEN[s.tera]+"\n";
  const ev=s.ev.map((v,i)=>v?v+" "+STEN[i]:"").filter(Boolean);if(ev.length)o+="EVs: "+ev.join(" / ")+"\n";
  o+=NATEN[s.nat]+" Nature\n";const iv=s.iv.map((v,i)=>v!==31?v+" "+STEN[i]:"").filter(Boolean);if(iv.length)o+="IVs: "+iv.join(" / ")+"\n";
  s.mv.filter(Boolean).forEach(m=>o+="- "+pretty(m)+"\n");return o}
const exportTeam=t=>t.m.map(exportSet).join("\n");
function importTeam(txt){const idx={};DEX.forEach(p=>{if(p)idx[toID(p.name)]=p});const out=[],bad=[];
  txt.replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).forEach(blk=>{const L=blk.split("\n").map(x=>x.trim()),first=L[0];
    let head=first.split(" @ "),nm=head[0].replace(/\s*\((M|F)\)\s*$/,"").trim(),it=head[1]||"";const pm=/\(([^()]+)\)\s*$/.exec(nm);if(pm)nm=pm[1];
    const p=idx[toID(nm)];if(!p){bad.push(nm);return}
    const s=newSet(p.id);s.item=it?slugify(it):"";
    L.slice(1).forEach(l=>{let m;
      if(m=/^Ability:\s*(.+)$/i.exec(l))s.ab=slugify(m[1]);
      else if(m=/^Level:\s*(\d+)/i.exec(l))s.lv=Math.max(1,Math.min(100,+m[1]));
      else if(m=/^Tera Type:\s*(.+)$/i.exec(l)){const k=TYEN.findIndex(x=>x.toLowerCase()===m[1].trim().toLowerCase());s.tera=k}
      else if(m=/^EVs:\s*(.+)$/i.exec(l)){m[1].split("/").forEach(x=>{const q=/(\d+)\s*(\w+)/.exec(x.trim());if(q){const k=STEN.findIndex(y=>y.toLowerCase()===q[2].toLowerCase());if(k>=0)s.ev[k]=Math.min(252,+q[1])}})}
      else if(m=/^IVs:\s*(.+)$/i.exec(l)){m[1].split("/").forEach(x=>{const q=/(\d+)\s*(\w+)/.exec(x.trim());if(q){const k=STEN.findIndex(y=>y.toLowerCase()===q[2].toLowerCase());if(k>=0)s.iv[k]=Math.min(31,+q[1])}})}
      else if(m=/^(\w+)\s+Nature$/i.exec(l)){const k=NATEN.findIndex(y=>y.toLowerCase()===m[1].toLowerCase());if(k>=0)s.nat=k}
      else if(m=/^[-–]\s*(.+)$/.exec(l)){const k=s.mv.findIndex(x=>!x);if(k>=0)s.mv[k]=slugify(m[1].split("/")[0])}});
    out.push(s)});return{sets:out.slice(0,6),bad:bad}}

const mvDot=m=>'<i class="mvd" style="--c:'+(MV[m]?TYPES[MV[m][1]][1]:"var(--line)")+'"></i>';
function tcHTML(s,i){const p=DEX[s.id-1];if(!p)return"";const st=setStats(s),c1=TYPES[p.t[0]][1],c2=TYPES[p.t[p.t.length-1]][1],n=NAT[s.nat]||[],tot=s.ev.reduce((a,b)=>a+b,0);

  '<div class="tcs">'+st.map((v,k)=>'<div class="tcst'+(NAT[s.nat]&&NAT[s.nat][1]===k?" up":NAT[s.nat]&&NAT[s.nat][2]===k?" dn":"")+'"><small>'+STATN[k]+'</small><b>'+v+'</b><span><i style="width:'+Math.min(100,v/(k===0?300:230)*100)+'%"></i></span>'+(s.ev[k]?"<em>"+s.ev[k]+"</em>":"")+"</div>").join("")+"</div>"+
  '<ul class="tcmv">'+[0,1,2,3].map(j=>s.mv[j]?"<li>"+mvDot(s.mv[j])+esc(mvn(s.mv[j]))+"</li>":'<li class="e">—</li>').join("")+"</ul>"+
  '<div class="tcf"><button class="btn" data-ted="'+i+'">Editar</button><button class="btn" data-pk="'+p.id+'">Ficha</button><span class="muted">EVs '+tot+"/510</span></div></article>"}
function wkMatrix(t){const mem=t.m.filter(s=>DEX[s.id-1]);if(!mem.length)return"";
  const M=mem.map(s=>applyAb(defMult(DEX[s.id-1].t),s.ab));
  const cell=v=>v===0?'<td class="c0">0</td>':v>=4?'<td class="c4">×4</td>':v>1?'<td class="c2">'+(v===2?"×2":mfmt(v))+"</td>":v===1?'<td class="c1"></td>':v<=.25?'<td class="cq">'+mfmt(v)+"</td>":'<td class="ch">'+mfmt(v)+"</td>";
  return'<div class="scroll"><table class="wkm"><thead><tr><th>Ataque</th>'+mem.map(s=>'<th><img alt="'+esc(dn(DEX[s.id-1]))+'" title="'+esc(dn(DEX[s.id-1]))+'" src="'+SPR+"pokemon/"+s.id+'.png"></th>').join("")+'<th class="tw">Débiles</th><th class="tr">Resisten</th></tr></thead><tbody>'+
  TYPES.map((ty,a)=>{const w=M.filter(m=>m[a]>1).length,r=M.filter(m=>m[a]<1).length;return'<tr class="'+(w>=3?"bad":w>r+1?"warn":"")+'"><th><span class="wki" style="--c:'+ty[1]+";--t:"+onC(ty[1])+'">'+ticon(a,14)+"</span>"+ty[0]+"</th>"+M.map(m=>cell(m[a])).join("")+'<td class="tw">'+(w||"")+'</td><td class="tr">'+(r||"")+"</td></tr>"}).join("")+"</tbody></table></div>"}
function covHTML(t){const mem=t.m.filter(s=>DEX[s.id-1]),ty=new Set();mem.forEach(s=>s.mv.forEach(m=>{if(m&&MV[m]&&MV[m][2]!=="t"&&MV[m][3]>0)ty.add(MV[m][1])}));
  if(!ty.size)return'<p class="muted">Añade movimientos de ataque a tus Pokémon para ver la cobertura ofensiva.</p>';
  return'<div class="cov">'+TYPES.map((x,i)=>{const ok=[...ty].some(a=>SE[a].includes(i));return'<span class="cv'+(ok?" ok":"")+'" style="--c:'+x[1]+'"><i>'+ticon(i,14)+"</i>"+x[0]+"<b>"+(ok?"✓":"✗")+"</b></span>"}).join("")+"</div>"}
function alerts(t){const mem=t.m.filter(s=>DEX[s.id-1]),A=[];
  if(mem.length<6)A.push(["info","Tu equipo tiene "+mem.length+" de 6 Pokémon."]);
  const sp={};mem.forEach(s=>{const k=sidOf(DEX[s.id-1]);(sp[k]=sp[k]||[]).push(s)});Object.keys(sp).forEach(k=>{if(sp[k].length>1)A.push(["warn","Especie repetida: "+dn(DEX[sp[k][0].id-1])+" (la regla de especies de VGC no lo permite)."])});
  const it={};mem.forEach(s=>{if(s.item)it[s.item]=(it[s.item]||0)+1});Object.keys(it).forEach(k=>{if(it[k]>1)A.push(["warn","Objeto repetido: "+itName(k)+" (la regla de objetos de VGC no lo permite)."])});
  const M=mem.map(s=>applyAb(defMult(DEX[s.id-1].t),s.ab));
  TYPES.forEach((ty,a)=>{const w=M.filter(m=>m[a]>1).length;if(w>=3)A.push(["warn",w+" de tus Pokémon son débiles al tipo "+ty[0]+"."])});
  const np=mem.filter(s=>!hasMove(s,PROTECT));if(mem.length&&np.length)A.push(["info","Sin movimiento de protección: "+np.map(s=>dn(DEX[s.id-1])).join(", ")+"."]);
  if(mem.length&&!mem.some(s=>hasMove(s,SPEEDCTL)||s.item==="choice-scarf"))A.push(["info","Sin control de velocidad (Viento Afín, Espacio Raro, Onda Trueno, Viento Hielo, Pañuelo Elegido…)."]);
  const ty=new Set();mem.forEach(s=>s.mv.forEach(m=>{if(m&&MV[m]&&MV[m][2]!=="t"&&MV[m][3]>0)ty.add(MV[m][1])}));
  if(ty.size){const un=TYPES.map((x,i)=>i).filter(i=>![...ty].some(a=>SE[a].includes(i)));if(un.length)A.push(["info","Ningún movimiento es súper efectivo contra: "+un.map(i=>TYPES[i][0]).join(", ")+"."])}
  mem.forEach(s=>{const tot=s.ev.reduce((a,b)=>a+b,0);if(tot<508)A.push(["info",dn(DEX[s.id-1])+": te quedan "+(510-tot)+" EVs sin repartir."])});
  if(!A.length)A.push(["ok","Sin avisos: el equipo cumple las comprobaciones básicas."]);return A}
function alertsHTML(t){return'<ul class="al">'+alerts(t).map(a=>'<li class="'+a[0]+'"><i>'+({warn:"!",info:"i",ok:"✓"})[a[0]]+"</i><span>"+esc(a[1])+"</span></li>").join("")+"</ul>"}

function tmBodyHTML(){const t=curT();let g='<div class="tmgrid">';for(let i=0;i<6;i++){g+=t.m[i]?tcHTML(t.m[i],i):'<button class="tc add" data-tadd="'+i+'"><span>+</span>Añadir Pokémon</button>'}g+="</div>";

const dcSide=()=>({id:0,lv:50,nat:12,ev:[0,0,0,0,0,0],item:"",ab:"",tera:-1,boost:0,mv:[]});
let DC={a:dcSide(),d:dcSide(),mv:"",pw:0,mt:0,cls:"p",weather:"",terrain:"",spread:false,crit:false,help:false,screen:false,burn:false};
const stg=b=>b>=0?(2+b)/2:2/(2-b);
function dcCalc(){const a=DC.a,d=DC.d,A=DEX[a.id-1],D=DEX[d.id-1];if(!A||!D||!(DC.pw>0))return null;
  const ph=DC.cls==="p",ai=ph?1:3,di=ph?2:4,mt=DC.mt,N=[];
  const sA=statCalc(A.s[ai],a.ev[ai],31,a.nat,a.lv,ai),sD=statCalc(D.s[di],d.ev[di],31,d.nat,d.lv,di),H=statCalc(D.s[0],d.ev[0],31,d.nat,d.lv,0);
  const ab=DC.crit?Math.max(a.boost,0):a.boost,db=DC.crit?Math.min(d.boost,0):d.boost;
  let at=Math.floor(sA*stg(ab)),df=Math.floor(sD*stg(db));
  if(ph&&(a.ab==="huge-power"||a.ab==="pure-power")){at*=2;N.push(abn(a.ab)+" ×2")}
  if(a.item==="choice-band"&&ph){at=Math.floor(at*1.5);N.push(itName(a.item)+" ×1,5")}
  if(a.item==="choice-specs"&&!ph){at=Math.floor(at*1.5);N.push(itName(a.item)+" ×1,5")}
  const dt=d.tera>=0?[d.tera]:D.t;
  if(d.item==="assault-vest"&&!ph){df=Math.floor(df*1.5);N.push(itName(d.item)+" ×1,5 Df.E")}
  if(DC.weather==="snow"&&ph&&dt.includes(5)){df=Math.floor(df*1.5);N.push("Nieve: tipo Hielo ×1,5 Def")}
  if(DC.weather==="sand"&&!ph&&dt.includes(12)){df=Math.floor(df*1.5);N.push("Arena: tipo Roca ×1,5 Df.E")}
  let pw=DC.pw;const mp=(m,t)=>{pw=Math.floor(pw*m);N.push(t)};
  if(a.ab==="technician"&&pw<=60)mp(1.5,abn(a.ab)+" ×1,5");
  if(DC.help)mp(1.5,"Ayuda ×1,5");
  if(DC.terrain==="electric"&&mt===3)mp(1.3,"Campo Eléctrico ×1,3");
  if(DC.terrain==="grassy"&&mt===4)mp(1.3,"Campo de Hierba ×1,3");
  if(DC.terrain==="psychic"&&mt===10)mp(1.3,"Campo Psíquico ×1,3");
  if(DC.terrain==="misty"&&mt===14)mp(.5,"Campo de Niebla ×0,5");
  if(a.item&&ITBOOST[a.item]===mt)mp(1.2,itName(a.item)+" ×1,2");
  let base=Math.floor(Math.floor(Math.floor(2*a.lv/5+2)*pw*at/df)/50)+2;
  if(DC.spread){base=Math.floor(base*.75);N.push("Ataque múltiple ×0,75")}
  if(DC.weather==="sun"){if(mt===1){base=Math.floor(base*1.5);N.push("Sol: Fuego ×1,5")}if(mt===2){base=Math.floor(base*.5);N.push("Sol: Agua ×0,5")}}
  if(DC.weather==="rain"){if(mt===2){base=Math.floor(base*1.5);N.push("Lluvia: Agua ×1,5")}if(mt===1){base=Math.floor(base*.5);N.push("Lluvia: Fuego ×0,5")}}
  if(DC.crit){base=Math.floor(base*1.5);N.push("Crítico ×1,5")}
  let stab=A.t.includes(mt)?1.5:1;if(a.tera>=0){stab=mt===a.tera?(A.t.includes(mt)?2:1.5):(A.t.includes(mt)?1.5:1)}
  if(a.ab==="adaptability"&&stab>1)stab=(a.tera>=0&&mt===a.tera&&A.t.includes(mt))?2.25:2;
  if(stab>1)N.push("STAB ×"+String(stab).replace(".",","));
  const eff=applyAb(defMult(dt),d.ab)[mt];if(eff!==1)N.push("Efectividad ×"+mfmt(eff).slice(1));
  const rolls=[];for(let r=85;r<=100;r++){let x=Math.floor(base*r/100);x=Math.floor(x*stab);x=Math.floor(x*eff);
    if(DC.burn&&ph&&a.ab!=="guts")x=Math.floor(x*.5);if(DC.screen&&!DC.crit)x=Math.floor(x*2/3);
    if(a.item==="life-orb")x=Math.floor(x*1.3);if(a.item==="expert-belt"&&eff>1)x=Math.floor(x*1.2);rolls.push(eff===0?0:Math.max(1,x))}
  if(DC.burn&&ph&&a.ab!=="guts")N.push("Quemado ×0,5");if(DC.screen&&!DC.crit)N.push("Pantalla ×⅔");if(a.item==="life-orb")N.push(itName(a.item)+" ×1,3");if(a.item==="expert-belt"&&eff>1)N.push(itName(a.item)+" ×1,2");
  return{rolls:rolls,min:rolls[0],max:rolls[15],H:H,eff:eff,at:at,df:df,notes:N,dt:dt}}

let QZ={n:0,ok:0,streak:0,best:0,q:null,sel:null};

function qzNew(){const L=baseDex();if(L.length<20){QZ.q=null;return}
  const r=Math.random();if(r<.5){qzNew0();return}
  const d=pick(L),tn_=t=>TYPES[t][0],combo=x=>x.map(tn_).join(" / "),pm=(txt,opts,ans,ex,mons)=>{QZ.q={k:"x",txt,mons:mons||[d],opts,ans,ex};QZ.sel=null};
  if(r<.65){const right=combo(d.t),set=new Set([right]);let g=0;while(set.size<4&&g++<60){const o=pick(L);set.add(combo(o.t))}const opts=shuf([...set]);
    pm("¿De qué tipo es <b>"+esc(dn(d))+"</b>?",opts,opts.indexOf(right),esc(dn(d))+" es de tipo "+right+".")}
  else if(r<.8){const gi=GENR.findIndex(g=>d.id>=g[0]&&d.id<=g[1]),idx=shuf([0,1,2,3,4,5,6,7,8].filter(i=>i!==gi)).slice(0,3).concat(gi).sort((a,b)=>a-b);
    pm("¿De qué generación es <b>"+esc(dn(d))+"</b>?",idx.map(i=>(i+1)+"ª generación"),idx.indexOf(gi),esc(dn(d))+" (n.º "+d.id+") es de la "+(gi+1)+"ª generación.")}
  else if(r<.9){let a,b;do{a=pick(L);b=pick(L)}while(a===b||a.bst===b.bst);const w=a.bst>b.bst?0:1;
    pm("¿Cuál tiene mayor total de estadísticas base?",[dn(a),dn(b)],w,esc(dn(a))+" suma "+a.bst+" y "+esc(dn(b))+" suma "+b.bst+".",[a,b])}
  else{const m=defMult(d.t),weak=[...Array(18).keys()].filter(t=>m[t]>1),ok=[...Array(18).keys()].filter(t=>m[t]<=1);
    if(!weak.length){qzNew0();return}const w=pick(weak),opts=shuf([w].concat(shuf(ok).slice(0,3)));
    pm("¿Contra qué tipo es débil <b>"+esc(dn(d))+"</b>?",opts.map(tn_),opts.indexOf(w),"Recibe daño superefectivo de: "+weak.map(tn_).join(", ")+".")}}
function qzNew0(){const L=baseDex();if(L.length<20){QZ.q=null;return}
  if(Math.random()<.65){const a=rnd(18),d=pick(L),m=defMult(d.t)[a],all=[0,.25,.5,1,2,4];
    const opts=shuf([m].concat(shuf(all.filter(x=>x!==m)).slice(0,3))).sort((x,y)=>x-y);
    QZ.q={k:"eff",txt:'¿Cuánto daño hace un ataque de tipo <b>'+TYPES[a][0]+"</b> a <b>"+esc(dn(d))+"</b>?",mons:[d],opts:opts.map(mulTxt),ans:opts.indexOf(m),ex:esc(dn(d))+" es de tipo "+d.t.map(t=>TYPES[t][0]).join("/")+": recibe "+mulTxt(m)+"."}}
  else{let a,b;do{a=pick(L);b=pick(L)}while(a===b||a.s[5]===b.s[5]);const w=a.s[5]>b.s[5]?0:1;
    QZ.q={k:"spd",txt:"¿Cuál tiene mayor Velocidad base?",mons:[a,b],opts:[dn(a),dn(b)],ans:w,ex:esc(dn(a))+" tiene "+a.s[5]+" y "+esc(dn(b))+" tiene "+b.s[5]+"."}}
  QZ.sel=null}
function vQuiz(){return'<h1>Cuestionario de práctica</h1><p class="muted" style="margin:4px 0 12px">Entrena los reflejos de VGC: efectividad de tipos y velocidades base. Sale una pregunta distinta cada vez.</p><div id="qzbox"></div>'}

const BALLS=[["Poké Ball",1],["Super Ball",1.5],["Ultra Ball",2],["Red Ball (agua o bicho)",3.5],["Ocaso Ball (noche o cueva)",3],["Veloz Ball (primer turno)",5],["Master Ball",255]];

function vCatch(){return'<h1>Calculadora de captura</h1><p class="muted" style="margin:4px 0 12px">Probabilidad de captura por lanzamiento con la fórmula clásica (generaciones III–V). En juegos más nuevos el resultado es orientativo.</p><div class="panel"><div class="bar"><input type="search" id="cpn" placeholder="Pokémon (para cargar su ratio)" aria-label="Pokémon"><button class="btn" id="cpl">Cargar ratio</button></div><div class="cpf"><label>Ratio de captura (1–255)<input type="number" id="cpr" min="1" max="255" value="'+CP.rate+'"></label><label>Vida restante: <b id="cphv">'+CP.hp+'%</b><input type="range" id="cph" min="1" max="100" value="'+CP.hp+'"></label><label>Poké Ball<select id="cpb">'+BALLS.map((b,i)=>'<option value="'+i+'"'+(i===CP.ball?" selected":"")+">"+b[0]+"</option>").join("")+'</select></label><label>Estado<select id="cps">'+STAT.map((b,i)=>'<option value="'+i+'"'+(i===CP.st?" selected":"")+">"+b[0]+"</option>").join("")+'</select></label></div><p class="muted" id="cpmsg" role="status" style="min-height:20px"></p></div><div class="panel cpo" id="cpout"></div>'}
function cpCalc(){const r=Math.max(1,Math.min(255,+CP.rate||1)),h=CP.hp/100,ball=BALLS[CP.ball][1],st=STAT[CP.st][1];
  const a=(3-2*h)/3*r*ball*st;let p;if(CP.ball===6||a>=255)p=1;else{const b=1048560/Math.sqrt(Math.sqrt(16711680/a));p=Math.pow(Math.min(b,65535)/65536,4)}
  const pc=p*100,txt=pc>=99.95?"100":pc<.1?"<0,1":pc.toFixed(1).replace(".",",");
  $("#cpout").innerHTML='<div class="cpp"><b>'+txt+'%</b><small>por lanzamiento</small></div><p>'+(p>=.9995?"Captura asegurada.":"Lanzamientos esperados hasta capturar: <b>"+(1/p).toFixed(1).replace(".",",")+"</b>. Probabilidad de capturarlo en 3 lanzamientos: <b>"+((1-Math.pow(1-p,3))*100).toFixed(0)+"%</b>.")+"</p>"}

  ["#cpr","#cph","#cpb","#cps"].forEach(s=>$(s).oninput=rd);
  $("#cpl").onclick=async()=>{const q=norm($("#cpn").value.trim()),d=baseDex().find(x=>norm(dn(x))===q)||baseDex().find(x=>norm(dn(x)).includes(q));if(!q||!d){$("#cpmsg").textContent="No encuentro ese Pokémon.";return}
    $("#cpmsg").textContent="Cargando…";try{const s=await api("pokemon-species/"+d.id);CP.rate=s.capture_rate;$("#cpr").value=CP.rate;$("#cpmsg").textContent="Ratio de "+dn(d)+": "+CP.rate+".";cpCalc()}catch(e){$("#cpmsg").textContent="No se pudo descargar el ratio. Escríbelo a mano."}};
  cpCalc()}

let GT={open:false,sel:0,list:[]};

const CH_API="https://api.github.com/repos/KevinToodlepoot/pokemon-champions-sprites/git/trees/main?recursive=1",CH_RAW="https://raw.githubusercontent.com/KevinToodlepoot/pokemon-champions-sprites/main/sprites/",CH_KEY="atlas-champs-v1";
let CHS=null,CHMAP=null,CHMAPN=-1;
try{const c=JSON.parse(localStorage.getItem(CH_KEY)||"null");if(c&&Array.isArray(c.l))CHS=new Set(c.l)}catch(e){}
function chMap(){if(CHMAP&&CHMAPN===DEX.length)return CHMAP;CHMAP=new Map();DEX.forEach(d=>{if(d&&d.mega&&d.slug)CHMAP.set(d.id,String(d.slug))});CHMAPN=DEX.length;return CHMAP}
function champUrl(id){if(!CHS||id<=1025)return null;const s=chMap().get(id);return s&&CHS.has(s)?CH_RAW+s+".png":null}
async function chLoad(){let old=null;try{old=JSON.parse(localStorage.getItem(CH_KEY)||"null")}catch(e){}
  if(old&&old.t&&Date.now()-old.t<7*864e5&&CHS)return;
  try{const r=await fetch(CH_API);if(!r.ok)throw 0;const j=await r.json(),l=(j.tree||[]).map(x=>x.path).filter(p=>/^sprites\/.+-mega(-[xyz])?\.png$/.test(p)).map(p=>p.slice(8,-4));
    if(!l.length)return;const had=CHS&&CHS.size;CHS=new Set(l);try{localStorage.setItem(CH_KEY,JSON.stringify({t:Date.now(),l}))}catch(e){}
    if(had!==CHS.size&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))render()}catch(e){}}
